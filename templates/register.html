{% extends "base.html" %}

{% block title %}Register{% endblock %}

{% block body %}
<main>
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <div class="d-flex align-items-baseline justify-content-center gap-2">
          <h1>FlagRa</h1>
          <p class="lead">Register</p>
        </div>
      </div>
    </div>
  </div>
  
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-md-6">
        <form action="{{ url_for('auth.register') }}" method="post">

          <div class="form-group">
            <label for="username">Username</label>
            <input class="form-control" name="username" type="text" id="username" required />            
          </div>

          <div class="form-group">
            <label for="password">Password</label>
            <input class="form-control" name="password" type="password" id="password" required/>
          </div>

          <div class="form-group">
            <label for="confirmation">Repeat password</label>
            <input class="form-control" name="confirmation" type="password" id="confirmation" required/>
          </div>

          <button type="submit" class="btn btn-outline-dark mt-2">Submit</button>
        </form>
      </div>
    </div>
  </div>
</main>
{% endblock %}
